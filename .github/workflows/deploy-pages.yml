name: Publier l'atelier S18 sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v6
      - name: Preparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dependances verrouillees
        run: npm ci
      - name: Construire le site et les packages
        run: npm run build
      - name: Controler le carnet et le livrable
        run: npm run check
      - name: Controler le dossier Challenge et ses archives
        run: python3 tools/check-challenge-s18.py
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparer le site a publier
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
